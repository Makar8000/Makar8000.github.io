<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<style TYPE='text/css'>
body {
	background-color: #252525;
	color: #e8e8e8
}

.highlighter .add { 
	background-color: #1c7b50;
}

.highlighter .remove { 
	background-color: #80372b;
}

.highlighter td.modify { 
	background-color: #2c5075;
}

.highlighter td.conflict { 
	background-color: #c72c41;
}

.highlighter .spec { 
	background-color: #505050;
}

.highlighter .move { 
	background-color: #353535;
}

.highlighter .null { 
	color: #666;
}

.highlighter table { 
	border-collapse:collapse;
}

.highlighter td, .highlighter th {
	border: 1px solid #444;
	padding: 3px 7px 2px;
}

.highlighter th, .highlighter .header, .highlighter .meta {
	background-color: #636363;
	font-weight: bold;
	padding-bottom: 4px;
	padding-top: 5px;
	text-align:left;
}

.highlighter tr.header th {
	border-bottom: 2px solid black;
}

.highlighter tr.index td, .highlighter .index, .highlighter tr.header th.index {
	background-color: #4a4a4a;
	border: none;
}

.highlighter .gap {
	color: #666;
}

.highlighter td {
	empty-cells: show;
	white-space: pre-wrap;
}
</style>
</head>
<body>
<div class='highlighter'>
<table>
<thead>
<tr class="spec"><td>!</td><td></td><td></td><td>...</td><td></td><td class="add">+++</td><td class="remove">---</td><td class="remove">---</td></tr>
<tr class="header"><th>@@</th><th>﻿key: int32</th><th>0: DeepDungeonEquipment</th><th>...</th><th>35: str</th><th class="add">36: uint32</th><th class="remove">36: uint16</th><th class="remove">37: uint32</th></tr>
</thead>
<tbody>
<tr><td>+</td><td>0</td><td></td><td>...</td><td></td><td class="add">0</td><td class="remove">0</td><td class="remove">0</td></tr>
<tr><td>+</td><td>1</td><td>Aetherpool Arm</td><td>...</td><td>the Palace of the Dead</td><td class="add">9</td><td class="remove">174</td><td class="remove">9</td></tr>
<tr><td>+</td><td>2</td><td>Empyrean Aetherpool Arm</td><td>...</td><td>Heaven-on-High</td><td class="add">10</td><td class="remove">540</td><td class="remove">10</td></tr>
<tr><td>+</td><td>3</td><td>Orthos Aetherpool Arm</td><td>...</td><td>Eureka Orthos</td><td class="add">11</td><td class="remove">897</td><td class="remove">11</td></tr>
<tr><td>+</td><td>4</td><td>Illumed Aetherpool Arm</td><td>...</td><td>Pilgrim's Traverse</td><td class="add">22</td><td class="remove">1032</td><td class="remove">22</td></tr>
</tbody>
</table>
</div>
</body>
</html>
