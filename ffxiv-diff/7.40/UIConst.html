<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<style TYPE='text/css'>
body {
	background-color: #252525;
	color: #e8e8e8
}

.highlighter .add { 
	background-color: #1c7b50;
}

.highlighter .remove { 
	background-color: #80372b;
}

.highlighter td.modify { 
	background-color: #2c5075;
}

.highlighter td.conflict { 
	background-color: #c72c41;
}

.highlighter .spec { 
	background-color: #505050;
}

.highlighter .move { 
	background-color: #353535;
}

.highlighter .null { 
	color: #666;
}

.highlighter table { 
	border-collapse:collapse;
}

.highlighter td, .highlighter th {
	border: 1px solid #444;
	padding: 3px 7px 2px;
}

.highlighter th, .highlighter .header, .highlighter .meta {
	background-color: #636363;
	font-weight: bold;
	padding-bottom: 4px;
	padding-top: 5px;
	text-align:left;
}

.highlighter tr.header th {
	border-bottom: 2px solid black;
}

.highlighter tr.index td, .highlighter .index, .highlighter tr.header th.index {
	background-color: #4a4a4a;
	border: none;
}

.highlighter .gap {
	color: #666;
}

.highlighter td {
	empty-cells: show;
	white-space: pre-wrap;
}
</style>
</head>
<body>
<div class='highlighter'>
<table>
<thead>
<tr class="header"><th>@@</th><th>﻿key: int32</th><th>0: int32</th></tr>
</thead>
<tbody>
<tr class="gap"><td>...</td><td>...</td><td>...</td></tr>
<tr><td></td><td>31</td><td>2</td></tr>
<tr class="modify"><td class="modify">→</td><td>32</td><td class="modify">2900→50</td></tr>
<tr class="modify"><td class="modify">→</td><td>33</td><td class="modify">15→2900</td></tr>
<tr class="modify"><td class="modify">→</td><td>34</td><td class="modify">20→15</td></tr>
<tr class="modify"><td class="modify">→</td><td>35</td><td class="modify">15→20</td></tr>
<tr class="modify"><td class="modify">→</td><td>36</td><td class="modify">20→15</td></tr>
<tr class="modify"><td class="modify">→</td><td>37</td><td class="modify">10→20</td></tr>
<tr class="modify"><td class="modify">→</td><td>38</td><td class="modify">1→10</td></tr>
<tr class="modify"><td class="modify">→</td><td>39</td><td class="modify">3300→1</td></tr>
<tr class="modify"><td class="modify">→</td><td>40</td><td class="modify">6600→3300</td></tr>
<tr class="modify"><td class="modify">→</td><td>41</td><td class="modify">10000→6600</td></tr>
<tr class="add"><td>+++</td><td>42</td><td>10000</td></tr>
<tr class="add"><td>+++</td><td>43</td><td>1</td></tr>
<tr class="add"><td>+++</td><td>44</td><td>10000</td></tr>
<tr class="add"><td>+++</td><td>45</td><td>15000</td></tr>
<tr class="add"><td>+++</td><td>46</td><td>25000</td></tr>
<tr class="add"><td>+++</td><td>47</td><td>400</td></tr>
<tr class="add"><td>+++</td><td>48</td><td>4300</td></tr>
</tbody>
</table>
</div>
</body>
</html>
